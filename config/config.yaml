# Configuration
---
model_provider:
  name: litellm
  api: openai
  api_key: ${API_KEY_LITELLM}
  endpoint: ${LITELLM_BASE_URL:-http://litellm:4000/v1}

model:
    name: deepinfra/deepseek-ai/DeepSeek-V4-Flash-0731
    effort: high
    
discord_adapter:
  bot_token: ${DISCORD_BOT_TOKEN:-}
    
heartbeat:
    interval: 300
    prompt_file: config/HEARTBEAT.md
    output_adapter: discord
    output_channel: ${HEARTBEAT_OUTPUT_CHANNEL:-}

matrix_adapter:
  homeserver_url: ${MATRIX_HOMESERVER_URL:-}
  access_token: ${MATRIX_ACCESS_TOKEN:-}
  user_id: ${MATRIX_USER_ID:-}
  device_id: ${MATRIX_DEVICE_ID:-}
  store_path: ${MATRIX_STORE_PATH:-}
  ignore_unverified_devices: true
logging:
  # Maximum characters of message content written to the log.
  # 0 or negative logs the full content.
  preview_size: 200
  # When true, tool inputs/outputs are attached to trace spans (bounded by
  # preview_size). Keep false to avoid exporting commands, file contents, or
  # secrets to the configured collector.
  capture_payloads: false
