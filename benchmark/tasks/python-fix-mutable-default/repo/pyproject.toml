[project]
name = "labels"
version = "0.1.0"
description = "Small label helper library used as a coding-agent benchmark task."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labels"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The public signature is fixed by the task and must keep the mutable default
# `labels: list[str] = []`. B006 is therefore ignored for this module only; the
# required behavior (fresh list when omitted) is enforced by the tests.
[tool.ruff.lint.per-file-ignores]
"src/labels/labels.py" = ["B006"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
